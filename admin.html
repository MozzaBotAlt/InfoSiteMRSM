<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoSIteMRSM Admin Panel</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.ico" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">MRSM INFO TV</p>
          <h1>Display control</h1>
          <p class="lead">
            Manage the playlist, picture announcements, ticker, and timetable
            embed.
          </p>
        </div>
        <a class="button button-secondary" href="index.html">Open display</a>
      </header>
      <p id="admin-status" class="admin-status" role="status" aria-live="polite"></p>
      <section class="admin-grid">
        <div class="admin-card">
          <p class="eyebrow">VIDEO PLAYLIST</p>
          <h2>Add a video</h2>
          <form id="slide-form">
            <label
              >Title<input
                id="slide-title"
                type="text"
                placeholder="College update" /></label
            ><label
              >Description<textarea
                id="slide-message"
                rows="3"
                placeholder="Short description"
              ></textarea></label
            ><label
              >Video URL<input
                id="slide-video"
                type="url"
                required
                placeholder="https://www.youtube.com/watch?v=..." /></label
            ><label
              >Play for at least (seconds)<input
                id="slide-duration"
                type="number"
                min="5"
                value="30"
            /></label>
            <div class="button-row">
              <button class="button button-primary" type="submit">
                Save video</button
              ><button
                class="button button-secondary"
                type="button"
                id="clear-btn"
              >
                Clear
              </button>
            </div>
          </form>
        </div>
        <div class="admin-card">
          <p class="eyebrow">PICTURE ANNOUNCEMENTS</p>
          <h2>Add BWP or Maktab</h2>
          <form id="announcement-form">
            <label
              >Section<select id="announcement-section">
                <option value="bwp">BWP</option>
                <option value="maktab">Maktab</option>
              </select></label
            ><label
              >Title<input
                id="announcement-title"
                type="text"
                required
                placeholder="Announcement title" /></label
            ><label
              >Picture URL<input
                id="announcement-image"
                type="url"
                required
                placeholder="https://example.com/poster.jpg" /></label
            ><label
              >Show for (seconds)<input
                id="announcement-duration"
                type="number"
                min="5"
                value="5"
            /></label>
            <div class="button-row">
              <button class="button button-primary" type="submit">
                Save announcement</button
              ><button
                class="button button-secondary"
                type="button"
                id="clear-announcement-btn"
              >
                Clear
              </button>
            </div>
          </form>
        </div>
        <div class="admin-card admin-wide">
          <p class="eyebrow">DISPLAY SETTINGS</p>
          <h2>Ticker and timetable</h2>
          <form id="settings-form" class="settings-grid">
            <label class="wide-field"
              >Ticker announcements<textarea
                id="footer-news"
                rows="3"
                placeholder="First announcement | Second announcement"
              ></textarea></label
            ><label
              >Scroll speed (seconds)<input
                id="ticker-duration"
                type="number"
                min="5"
                value="24" /></label
            ><label
              >Timetable embed URL<input
                id="timetable-url"
                type="url"
                placeholder="https://calendar.example.com/embed" /></label
            >
            <div class="wide-field">
              <button class="button button-primary" type="submit">
                Save display settings
              </button>
            </div>
          </form>
          <p class="hint">
            Use a public HTTPS embed URL.
          </p>
        </div>
        <div class="admin-card admin-wide">
          <p class="eyebrow">CONTENT LIBRARY</p>
          <h2>Saved videos</h2>
          <div id="slide-list" class="slide-list"></div>
          <div class="list-footer">
            <button
              class="button button-secondary"
              type="button"
              id="export-btn"
            >
              Export JSON</button
            ><button
              class="button button-secondary"
              type="button"
              id="import-btn"
            >
              Import JSON
            </button>
          </div>
          <textarea
            id="import-json"
            placeholder="Paste video JSON here"
          ></textarea>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
