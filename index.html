<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRSM Info TV</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="display-page">
    <main class="display-screen" aria-label="MRSM media display">
      <div id="media-stage" class="media-stage">
        <section id="empty-state" class="display-empty-state" aria-live="polite">
          <header class="empty-brand">
            <div class="empty-brand-mark">MRSM</div>
            <div>
              <p class="empty-eyebrow">INFORMATION DISPLAY</p>
              <h1>MRSM Information Centre</h1>
            </div>
          </header>

          <div class="empty-layout">
            <section class="empty-main-section">
              <p class="empty-eyebrow">TODAY'S NOTICE</p>
              <h2>No announcements published</h2>
              <p>New videos, pictures, and announcements will appear here as soon as they are added.</p>
            </section>

            <aside class="empty-side-section picture-announcement-rail">
              <section class="picture-announcement-card" data-section="maktab">
                <p class="empty-eyebrow">MAKTAB ANNOUNCEMENT</p>
                <div class="picture-announcement-frame">
                  <img id="empty-maktab-image" alt="Maktab announcement" hidden />
                  <span class="picture-announcement-placeholder">MAKTAB PICTURE</span>
                </div>
              </section>
              <section class="picture-announcement-card" data-section="bwp">
                <p class="empty-eyebrow">BWP ANNOUNCEMENT</p>
                <div class="picture-announcement-frame">
                  <img id="empty-bwp-image" alt="BWP announcement" hidden />
                  <span class="picture-announcement-placeholder">BWP PICTURE</span>
                </div>
              </section>
            </aside>
          </div>

          <footer class="empty-footer">
            <p>MRSM Information System</p>
            <time id="empty-clock"></time>
          </footer>
        </section>
      </div>
      <div id="sliding-text" class="sliding-text" aria-live="off" hidden></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
