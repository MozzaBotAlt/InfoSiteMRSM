<!doctype html>
<html lang="en-MY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MRSM Langkawi system maintenance display" />
    <title>Maintenance | MRSM Langkawi</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" href="../favico.ico" />
  </head>
  <body class="maintenance-page">
    <main class="maintenance-shell">
      <div class="maintenance-watermark" aria-hidden="true">MOZZABOT</div>
      <div class="maintenance-content">
        <p class="maintenance-status"><span aria-hidden="true"></span> SYSTEM UPDATE</p>
        <h1>Maintenance in progress</h1>
        <p class="maintenance-subtitle">We will be back.</p>
        <time id="maintenance-clock">--:--:--</time>
        <p id="maintenance-date"></p>
      </div>
    </main>
    <script src="../script.js"></script>
  </body>
</html>
